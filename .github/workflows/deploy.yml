name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar ficheiros para pasta de output
        run: |
          mkdir -p _site
          rsync -av --exclude='_site' --exclude='.git' --exclude='.github' . _site/

      - name: Gerar js/config.js com os Secrets
        run: |
          cat > _site/js/config.js << ENDOFFILE
          'use strict';

          window.FIREBASE_CONFIG = {
            apiKey:            '${{ secrets.FIREBASE_API_KEY }}',
            authDomain:        '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
            projectId:         '${{ secrets.FIREBASE_PROJECT_ID }}',
            storageBucket:     '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
            messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
            appId:             '${{ secrets.FIREBASE_APP_ID }}'
          };

          window.CLOUD_FUNCTION_URL = '${{ secrets.CLOUD_FUNCTION_URL }}';
          ENDOFFILE

      - name: Verificar que config.js foi gerado
        run: cat _site/js/config.js

      - name: Deploy para gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          exclude_assets: '.github'
