name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar js/config.js com os Secrets
        run: |
          echo "'use strict';" > js/config.js
          echo "" >> js/config.js
          echo "window.FIREBASE_CONFIG = {" >> js/config.js
          echo "  apiKey:            '${{ secrets.FIREBASE_API_KEY }}'," >> js/config.js
          echo "  authDomain:        '${{ secrets.FIREBASE_AUTH_DOMAIN }}'," >> js/config.js
          echo "  projectId:         '${{ secrets.FIREBASE_PROJECT_ID }}'," >> js/config.js
          echo "  storageBucket:     '${{ secrets.FIREBASE_STORAGE_BUCKET }}'," >> js/config.js
          echo "  messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}'," >> js/config.js
          echo "  appId:             '${{ secrets.FIREBASE_APP_ID }}'" >> js/config.js
          echo "};" >> js/config.js
          echo "" >> js/config.js
          echo "window.CLOUD_FUNCTION_URL = '${{ secrets.CLOUD_FUNCTION_URL }}';" >> js/config.js

      - name: Verificar config.js gerado
        run: cat js/config.js

      - name: Deploy para gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
